name: deploy
on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys; don't cancel a run mid-publish or Pages ends up in a
# weird half-updated state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Cache astral Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/astral
          key: ${{ runner.os }}-astral-chromium-v1

      - name: Type check
        run: deno task check

      - name: Serve website
        run: |
          deno task start > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..60}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8005; then
              echo "server up"
              exit 0
            fi
            if ! kill -0 $(cat server.pid) 2>/dev/null; then
              echo "server died during startup. log:"
              cat server.log
              exit 1
            fi
            sleep 1
          done
          echo "server never came up. log:"
          cat server.log
          exit 1
        timeout-minutes: 3

      - name: Staticalize
        env:
          ASTRAL_QUIET_INSTALL: "1"
        run: deno task staticalize

      - name: Dump server log on failure
        if: failure()
        run: |
          echo "=== server.log ==="
          cat server.log || echo "(no server.log)"
          echo "=== end ==="

      - name: Verify build output
        run: |
          test -f built/index.html
          test -f built/cv/index.html || test -f built/cv.html
          test -f built/cv.pdf
          test -f built/sitemap.xml
          test -f built/CNAME
          test -f built/hat.html
          test -f built/checked-vs-unchecked.html
          test -f built/images/hat.jpg
          head -c 4 built/cv.pdf | grep -q '%PDF'
          test $(stat -c%s built/cv.pdf) -gt 10000
          grep -q '<?xml' built/sitemap.xml
          grep -q '<url>' built/sitemap.xml
          grep -q '<loc>' built/sitemap.xml
          ! grep -q '<urls>' built/sitemap.xml
          # Legacy pages must be present but must NOT appear in the sitemap.
          ! grep -q '/hat.html' built/sitemap.xml
          ! grep -q '/checked-vs-unchecked.html' built/sitemap.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: built

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
